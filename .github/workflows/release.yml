name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # publish the image to GHCR

jobs:
  release:
    name: Publish backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # v0.1.0 -> 0.1.0, written in the pom of this run only (never committed)
      - name: Set version from tag
        working-directory: backend
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Releasing version $VERSION"

      # A release is published only if every test passes on this exact commit
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name and tags: 0.1.0, 0.1 and latest, plus the OCI labels
      # that link the package to this repository
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/helper-730-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Release notes are generated from the titles of the merged pull requests
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
