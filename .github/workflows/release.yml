on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      # needed for "gh release create"
      contents: write
      # needed for push su ghcr.io
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # v0.2.0 -> 0.2.0, written in the pom of this run only (never committed)
      - name: Set version from tag
        working-directory: backend
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Releasing version $VERSION"

      # A release is published only if every test passes on this exact commit
      - name: Build and test backend
        working-directory: backend
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- backend image ----
      - id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/helper-730-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ---- frontend image (its Dockerfile runs the type check and the build) ----
      - id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/helper-730-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # Release notes are generated from the titles of the merged pull requests
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
