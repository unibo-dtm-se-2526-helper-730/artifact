name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests and integration tests on PostgreSQL (failsafe + Testcontainers)
      - name: Build and test
        run: ./mvnw -B verify

      # Fails the check if the image does not build; nothing is published
      - name: Build Docker image
        run: docker build -t helper-730-backend:ci .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc type check + Vite production build
      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t helper-730-frontend:ci .
