spring.application.name=helper730

# Database: defaults match docker-compose.yml, override with environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helper730}
spring.datasource.username=${DB_USER:helper730}
spring.datasource.password=${DB_PASSWORD:helper730}

# The schema is owned by Flyway, not by Hibernate
# validate: the app stops at the start up if the entity is not matching the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON field names in snake_case (import_batches -> imported_at, batch_id...)
spring.jackson.property-naming-strategy=SNAKE_CASE
# Largest CSV accepted
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Country where the securities are held (ISO 3166 alpha-2): Revolut Securities Europe UAB
helper730.broker-country=LT

# Messages: i18n/messages.properties (Italian, default) and i18n/messages_en.properties
spring.messages.basename=i18n/messages
# An unsupported language falls back to the default file, never to the server's locale
spring.messages.fallback-to-system-locale=false
# Every message goes through MessageFormat, even without parameters: apostrophes are always written ''
spring.messages.always-use-message-format=true