services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-helper730}
      POSTGRES_USER: ${DB_USER:-helper730}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helper730}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: helper-730-backend:dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-helper730}
      DB_USER: ${DB_USER:-helper730}
      DB_PASSWORD: ${DB_PASSWORD:-helper730}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: helper-730-frontend:dev
    ports:
      - "3000:80"
    depends_on:
      - backend
      
volumes:
  pgdata: