server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container: "backend" is its service name in docker compose
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # same upload limit as the backend (spring.servlet.multipart.max-file-size)
        client_max_body_size 2m;
    }

    # Built files have a content hash in their name: they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path gets index.html
    location / {
        try_files $uri /index.html;
    }
}